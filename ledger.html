          <tr><th>Still in cooldown</th><th>Last voted</th><th>Eligible again</th></tr>
        </thead>

<script>
  const data = JSON.parse(document.getElementById('vote-data').textContent);

  function fmtAbs(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleString('en-US', {
      timeZone: data.timezone,
      month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit'
    });
  }

  function fmtRelative(iso) {
    const then = new Date(iso).getTime();
    const now = Date.now();
    const mins = Math.round((now - then) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + ' min ago';
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
    const days = Math.round(hrs / 24);
    return days + (days === 1 ? ' day ago' : ' days ago');
  }

  function dateKey(iso) {
    // yyyy-mm-dd in the contest's timezone, sortable as a string
    return new Date(iso).toLocaleDateString('en-CA', { timeZone: data.timezone });
  }

  function dateLabel(key) {
    const [y, m, d] = key.split('-').map(Number);
    const noon = new Date(Date.UTC(y, m - 1, d, 12));
    return noon.toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric' });
  }

  const freeSorted = [...data.freeVotes].sort((a, b) => new Date(b.approxTime) - new Date(a.approxTime));
  const donationSorted = [...data.donationVotes].sort((a, b) => new Date(b.approxTime) - new Date(a.approxTime));

  document.getElementById('free-count').textContent = freeSorted.length + (freeSorted.length === 1 ? ' voter' : ' voters');
  document.getElementById('donation-count').textContent = donationSorted.length + (donationSorted.length === 1 ? ' voter' : ' voters');

  const totalDonationVotes = donationSorted.reduce((s, v) => s + (v.votes || 0), 0);
  const grandTotalVotes = freeSorted.length + totalDonationVotes;

  const COOLDOWN_HOURS = 24;
  const COOLDOWN_MS = COOLDOWN_HOURS * 60 * 60 * 1000;

  function fmtCountdown(ms) {
    const totalMin = Math.max(0, Math.ceil(ms / 60000));
    const days = Math.floor(totalMin / 1440);
    const hours = Math.floor((totalMin % 1440) / 60);
    const mins = totalMin % 60;
    if (days > 0) return `${days}d ${hours}h`;
    if (hours > 0) return `${hours}h ${mins}m`;
    return `${mins}m`;
  }

  const lastVotedByName = {};
  freeSorted.forEach(v => {
    const t = new Date(v.approxTime).getTime();
    if (!(v.name in lastVotedByName) || t > lastVotedByName[v.name]) {
      lastVotedByName[v.name] = t;
    }
  });

  const nowMs = Date.now();
  const reminderRows = Object.entries(lastVotedByName).map(([name, lastVoted]) => {
    const eligibleAt = lastVoted + COOLDOWN_MS;
    return { name, lastVoted, eligibleAt, ready: nowMs >= eligibleAt };
  });

  reminderRows.sort((a, b) => {
    if (a.ready !== b.ready) return a.ready ? -1 : 1;
    return a.ready ? (a.lastVoted - b.lastVoted) : (a.eligibleAt - b.eligibleAt);
  });

  const readyCount = reminderRows.filter(r => r.ready).length;

  const statRow = document.getElementById('stat-row');
  statRow.innerHTML = `
    <div class="stat"><span class="n">${grandTotalVotes}</span><span class="l">Total votes, all time</span></div>
    <div class="stat"><span class="n">${freeSorted.length}</span><span class="l">Free voters logged</span></div>
    <div class="stat"><span class="n">${totalDonationVotes}</span><span class="l">Donation votes logged</span></div>
  `;

  document.getElementById('reminder-count').textContent =
    `${readyCount} ready now · ${reminderRows.length} tracked`;

  const readyRows = reminderRows.filter(r => r.ready);
  const waitingRows = reminderRows.filter(r => !r.ready);

  const readyCallout = document.getElementById('ready-callout');
  if (readyRows.length === 0) {
    readyCallout.innerHTML = '<div class="ready-empty">Nobody has cleared their 24-hour cooldown yet — check back later.</div>';
  } else {
    readyCallout.innerHTML = `
      <div class="ready-callout">
        <span class="rc-title">${readyRows.length} ${readyRows.length === 1 ? 'voter is' : 'voters are'} ready for a reminder right now</span>
        ${readyRows.map(r => `
          <div class="rc-row">
            <span class="rc-name">${r.name}</span>
            <span class="rc-when">last voted ~${fmtRelative(r.lastVoted)}</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  const reminderBody = document.getElementById('reminder-body');
  const waitingTable = document.getElementById('waiting-table');
  if (waitingRows.length === 0) {
    waitingTable.style.display = 'none';
  } else {
    waitingTable.style.display = '';
    reminderBody.innerHTML = waitingRows.map(r => `
      <tr>
        <td>${r.name}</td>
        <td>~${fmtRelative(r.lastVoted)}<span class="status-sub">${fmtAbs(r.lastVoted)}</span></td>
        <td style="text-align:right"><span class="status-wait">in ${fmtCountdown(r.eligibleAt - nowMs)}</span><span class="status-sub">eligible ${fmtAbs(r.eligibleAt)}</span></td>
      </tr>
    `).join('');
  }

  const warningsForDaily = data.gapWarnings || [];
  const gapDays = new Set();
  warningsForDaily.forEach(w => {
    gapDays.add(dateKey(w.from));
    gapDays.add(dateKey(w.to));
  });

  const dayMap = {};
  function ensureDay(key) {
    if (!dayMap[key]) dayMap[key] = { free: 0, donation: 0 };
    return dayMap[key];
  }
  freeSorted.forEach(v => { ensureDay(dateKey(v.approxTime)).free += 1; });
  donationSorted.forEach(v => { ensureDay(dateKey(v.approxTime)).donation += (v.votes || 0); });
  gapDays.forEach(key => ensureDay(key));

  const dayKeys = Object.keys(dayMap).sort().reverse();
  document.getElementById('daily-count').textContent = dayKeys.length + (dayKeys.length === 1 ? ' day' : ' days');

  const dailyBody = document.getElementById('daily-body');
  if (dayKeys.length === 0) {
    dailyBody.innerHTML = '<tr><td colspan="4" class="empty">No votes logged yet.</td></tr>';
  } else {
    dailyBody.innerHTML = dayKeys.map(key => {
      const day = dayMap[key];
      const total = day.free + day.donation;
      const gapChip = gapDays.has(key) ? '<span class="gap-chip">gap risk</span>' : '';
      return `
        <tr>
          <td>${dateLabel(key)}${gapChip}</td>
          <td>${day.free}</td>
          <td>${day.donation}</td>
          <td>${total}</td>
        </tr>
      `;
    }).join('');
  }

  document.getElementById('daily-foot').innerHTML = `
    <tr>
      <td>All time</td>
      <td>${freeSorted.length}</td>
      <td>${totalDonationVotes}</td>
      <td>${grandTotalVotes}</td>
    </tr>
  `;

  const gapBox = document.getElementById('gap-warnings');
  const warnings = data.gapWarnings || [];
  if (warnings.length === 0) {
    gapBox.innerHTML = '';
  } else {
    gapBox.innerHTML = `
      <div class="warning-box">
        <span class="w-title">Possible gaps &mdash; all 3 slots turned over between checks</span>
        <ul>
          ${warnings.map(w => `<li>Between ${fmtAbs(w.from)} and ${fmtAbs(w.to)} &mdash; can't confirm every free voter in this window was caught.</li>`).join('')}
        </ul>
      </div>
    `;
  }

  const freeLedger = document.getElementById('free-ledger');
  if (freeSorted.length === 0) {
    freeLedger.innerHTML = '<div class="empty">No free votes logged yet.</div>';
  } else {
    freeLedger.innerHTML = freeSorted.map(v => `
      <div class="row">
        <div class="name">${v.name}</div>
        <div class="when">~${fmtRelative(v.approxTime)}<span class="abs">${fmtAbs(v.approxTime)}</span></div>
      </div>
    `).join('');
  }

  const donationLedger = document.getElementById('donation-ledger');
  if (donationSorted.length === 0) {
    donationLedger.innerHTML = '<div class="empty">No donation votes logged yet.</div>';
  } else {
    donationLedger.innerHTML = donationSorted.map(v => `
      <div class="row">
        <div class="name">${v.name}<span class="chip">${v.votes} votes</span></div>
        <div class="when">~${fmtRelative(v.approxTime)}<span class="abs">${fmtAbs(v.approxTime)}</span></div>
        ${v.comment ? `<div class="comment">&ldquo;${v.comment}&rdquo;</div>` : ''}
      </div>
    `).join('');
  }

  document.getElementById('footer').innerHTML = `
    Times are approximate &mdash; the dashboard only reports relative times ("20 minutes ago"), so entries are
    timestamped when spotted, not to the second, and daily totals group votes by the day they approximately landed
    on in ${data.timezone.split('/')[1].replace('_', ' ')} time. Because only the 3 most recent free votes are ever
    visible at once, the tracker checks about once a minute &mdash; at that pace, a vote can only slip through
    unseen if more than 3 people vote inside a single minute. A "gap risk" chip
    on a day in the daily totals means at least one check that day found all 3 free-vote slots turned over at once,
    so that day's free vote count may be an undercount. The reminder tracker assumes each free voter can vote again
    24 hours after their last logged vote &mdash; "ready to remind" means that window has passed based on the most
    recent vote seen for them, but if an earlier vote from them was ever missed (see gap risk above), they could
    already be eligible sooner than shown. Treat all totals here as a floor, not a guaranteed exact
    count. This page auto-refreshes every minute so shared viewers stay in sync with the latest checks. Source:
    <a href="${data.contestUrl}" target="_blank" rel="noopener">contest dashboard</a>.
  `;

  setTimeout(() => { window.location.reload(); }, 60000);
</script>
